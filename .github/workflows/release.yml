name: Build and Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build Chrome ZIP release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="v$VERSION"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Build Chrome ZIP
        run: pnpm build:pack

      - name: Verify release artifact
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARTIFACT=".output/youtube-downloader-$VERSION-chrome.zip"
          test -f "$ARTIFACT"
          echo "Release artifact:"
          ls -lh "$ARTIFACT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: .output/youtube-downloader-*-chrome.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
